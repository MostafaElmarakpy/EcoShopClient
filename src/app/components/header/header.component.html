<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" [routerLink]="['/home']">EcoShop</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/home']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/products']" routerLinkActive="active">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/map']" routerLinkActive="active">Store Map</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/about']" routerLinkActive="active">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/contact']" routerLinkActive="active">Contact</a>
        </li>
        @if (isAdmin) {
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Admin</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" [routerLink]="['/admin/products']">Manage Products</a></li>
              <li><a class="dropdown-item" [routerLink]="['/admin/users']">Manage Users</a></li>
            </ul>
          </li>
        }
      </ul>

      <form class="d-flex align-items-center gap-2 me-3" role="search">
        <input class="form-control" type="search" placeholder="Search products" [formControl]="searchControl" aria-label="Search products" />
        <button class="btn btn-outline-secondary" type="button" (click)="toggleTheme()">
          {{ themeService.theme() === 'dark' ? 'Light' : 'Dark' }}
        </button>
      </form>

      <ul class="navbar-nav align-items-center">
        <li class="nav-item d-flex align-items-center">
          @if (profilePictureUrl) {
            <img [src]="profilePictureUrl" alt="Profile Picture" (click)="editProfile()" class="rounded-circle" style="width:40px;height:40px;object-fit:cover;cursor:pointer;margin-right:8px;" />
          } @else {
            @if (loginDisplay) {
              <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile Picture" class="rounded-circle" style="width:40px;height:40px;object-fit:cover;cursor:pointer;margin-right:8px;" />
            }
          }
          @if (loginDisplay) {
            <a class="nav-link" (click)="logout()">Logout</a>
          }
          @if (!loginDisplay) {
            <a class="nav-link" [routerLink]="['/login']">Login</a>
            <a class="nav-link" [routerLink]="['/register']">Register</a>
          }
        </li>
      </ul>
    </div>
  </div>
</nav>
