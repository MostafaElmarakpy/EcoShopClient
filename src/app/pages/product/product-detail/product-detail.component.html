<div class="container py-5">
  <button class="btn btn-link mb-3" (click)="goBack()">← Back to products</button>

  <div *ngIf="loading()" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

  <div *ngIf="product()" class="row g-4">
    <div class="col-12 col-lg-6">
      <img [src]="getImageUrl(product()?.imagePath)" class="img-fluid rounded shadow-sm" [alt]="product()?.name" loading="lazy" />
    </div>
    <div class="col-12 col-lg-6">
      <h1 class="display-5">{{ product()?.name }}</h1>
      <p class="text-muted mb-2">{{ product()?.category }}</p>
      <h2 class="text-primary mb-3">{{ product()?.price | currency }}</h2>
      <p class="mb-2"><strong>Product code:</strong> {{ product()?.productCode }}</p>
      <p class="mb-2"><strong>Minimum quantity:</strong> {{ product()?.minimumQuantity }}</p>
      <p class="mb-4"><strong>Discount:</strong> {{ product()?.discountRate }}%</p>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-primary btn-lg" (click)="addToCart()">Add to Cart</button>
        <button class="btn btn-primary btn-lg" (click)="buyNow()">Buy Now</button>
      </div>
    </div>
  </div>
</div>
