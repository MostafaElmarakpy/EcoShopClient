<div class="container py-5">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start mb-4 gap-3">
    <div>
      <h1 class="display-5 text-primary">Shop products</h1>
      <p class="text-muted">Browse, filter, sort, and navigate with responsive pagination.</p>
    </div>

    <div class="d-flex gap-2 flex-wrap">
      <input
        type="search"
        class="form-control"
        placeholder="Search products"
        [value]="searchTerm()"
        (input)="onSearch($any($event.target).value)"
      />
      <select class="form-select" [value]="selectedCategory()" (change)="onCategoryChange($any($event.target).value)">
        <option value="">All categories</option>
        <option *ngFor="let category of categories()" [value]="category">{{ category }}</option>
      </select>
      <div class="btn-group" role="group">
        <button class="btn btn-outline-secondary" type="button" (click)="onSort('name')">
          Name
        </button>
        <button class="btn btn-outline-secondary" type="button" (click)="onSort('price')">
          Price
        </button>
        <button class="btn btn-outline-secondary" type="button" (click)="onSort('category')">
          Category
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="loading()" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3">Loading products...</p>
  </div>

  <div *ngIf="errorMessage()" class="alert alert-danger">
    {{ errorMessage() }}
  </div>

  <div class="row g-4" *ngIf="!loading() && !errorMessage()">
    <div *ngFor="let product of pagedProducts()" class="col-12 col-sm-6 col-lg-4">
      <div class="card h-100 shadow-sm product-card">
        <img [src]="getImageUrl(product.imagePath)" class="card-img-top" [alt]="product.name" />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text text-secondary mb-2">{{ product.category }}</p>
          <div class="mb-3">
            <strong>{{ product.price | currency }}</strong>
          </div>
          <button class="btn btn-primary mt-auto" (click)="navigateToDetail(product.id)">
            View details
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-4" *ngIf="!loading() && totalPages() > 1">
    <div>
      <small class="text-muted">Page {{ currentPage() }} of {{ totalPages() }}</small>
    </div>
    <div class="btn-group">
      <button class="btn btn-outline-primary" [disabled]="currentPage() === 1" (click)="previousPage()">Previous</button>
      <button class="btn btn-outline-primary" [disabled]="currentPage() === totalPages()" (click)="nextPage()">Next</button>
    </div>
  </div>
</div>
