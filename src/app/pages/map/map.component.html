<div class="container py-5">
  <h2 class="mb-4">Your current location</h2>

  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

  <div *ngIf="!location() && !error()" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3">Getting your current location…</p>
  </div>

  <div *ngIf="location()" class="ratio ratio-16x9">
    <iframe
      [src]="mapUrl"
      frameborder="0"
      style="border:0;"
      allowfullscreen
      loading="lazy"
    ></iframe>
  </div>
</div>
