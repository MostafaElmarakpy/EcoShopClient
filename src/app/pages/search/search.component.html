<div class="container py-5">
  <h2 class="mb-3">Search results</h2>
  <p *ngIf="query()" class="text-muted mb-4">Showing results for "{{ query() }}".</p>

  <div *ngIf="loading()" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

  <div *ngIf="!loading() && query() && results().length === 0" class="alert alert-secondary">
    No products match your search.
  </div>

  <div class="row g-4">
    <div *ngFor="let product of results()" class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text text-muted">{{ product.category }}</p>
          <p class="card-text fw-bold">{{ product.price | currency }}</p>
          <a [routerLink]="['/product', product.id]" class="btn btn-outline-primary">See details</a>
        </div>
      </div>
    </div>
  </div>
</div>
